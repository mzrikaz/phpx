[package]
name = "phpx-interp"
description = "Tree-walking interpreter for phpx: dev mode and semantic reference for the compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
phpx-syntax = { path = "../syntax" }
phpx-runtime = { path = "../runtime" }
phpx-jit = { path = "../jit" }
indexmap = "2"
rustc-hash = "2"
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
digest = "0.10"
flate2 = "1"
bcrypt = "0.15"
libc = "0.2"
memchr = "2"
chrono-tz = "0.10"
chrono = { version = "0.4", default-features = false }
pcre2 = "0.2"
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
md2 = "0.10"
md4 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
whirlpool = "0.10"
tiger = "0.2"
gost94 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh32", "xxh64", "xxh3"] }
aes = "0.8"
ghash = "0.5"
