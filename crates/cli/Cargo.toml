[package]
name = "phpx-cli"
description = "phpx command line: check, ast"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# In-process sampling profiler: PHPX_PROFILE=1 phpx run file.php
profile = ["dep:pprof", "dep:backtrace", "dep:libc"]

[[bin]]
name = "phpx"
path = "src/main.rs"

[dependencies]
phpx-syntax = { path = "../syntax" }
phpx-interp = { path = "../interp" }
pprof = { version = "0.14", optional = true, features = ["frame-pointer"] }
backtrace = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }
